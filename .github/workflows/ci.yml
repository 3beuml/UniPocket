name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 红线守卫：公共仓库里绝不能出现本校标识
  redline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 扫描本校标识
        run: |
          set -e
          # 需要拦截的词：学校域名、伪装 UA、房间表文件名等
          # 命中任意一条即失败。新增词条时同步更新 docs/INTEGRATION.md 的自检清单。
          if grep -rniE 'zzu\.edu\.cn|supwisdom|rooms\.json|豫见郑大' \
              --exclude=ci.yml \
              --exclude-dir=.git --exclude-dir=build --exclude-dir=.gradle .; then
            echo "::error::发现本校标识，禁止入库"
            exit 1
          fi
          echo "红线扫描通过"

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: 安装 SDK 36
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: 单元测试
        run: ./gradlew --no-daemon :core-domain:test

      - name: 编译 demo
        run: ./gradlew --no-daemon :demo:assembleDebug

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: demo-debug-apk
          path: demo/build/outputs/apk/debug/*.apk
          if-no-files-found: error
